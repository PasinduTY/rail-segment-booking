services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RailBookingDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # The frontend container is reached by the *browser* at this
      # host-published origin, not by its internal Docker service name -
      # see the frontend service's VITE_API_BASE_URL build arg below.
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same value used for local non-Docker dev (frontend/.env.example) -
        # the browser reaches the API at this host-published port either way,
        # regardless of what's happening inside Docker's internal network.
        VITE_API_BASE_URL: http://localhost:5080
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
